[project]
name = "market-data"
version = "0.1.0"
description = "One local store and HTTP API for market data: every source fetched once, served to every project."
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb==2.0.1",
    "thetadatadx-py==0.9.0",
    "polars==2.1.0",
    "pyarrow==26.0.1",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.9",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[project.scripts]
market-data = "market_data.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
